[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evora-ai"
version = "0.1.0"
description = "EvOrA-AI: executable SAIA assurance record, validator and selective revalidation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["jupyter", "nbclient", "ipykernel"]

[project.scripts]
evora = "evora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
